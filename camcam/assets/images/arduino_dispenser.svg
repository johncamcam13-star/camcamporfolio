<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="ardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#996515" />
      <stop offset="100%" stop-color="#593A04" />
    </linearGradient>

    <!-- Silver Metallic Gradients -->
    <linearGradient id="ardSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="lcdGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <filter id="ardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="450" fill="#0A0B0E" />

  <!-- Ambient Glow -->
  <circle cx="240" cy="220" r="150" fill="#D4AF37" opacity="0.08" filter="url(#ardGlow)" />
  <circle cx="600" cy="220" r="160" fill="#0284C7" opacity="0.08" filter="url(#ardGlow)" />

  <!-- Outer Hardware Schematic Border -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#10131A" stroke="url(#ardGold)" stroke-width="1.5" />

  <!-- Technical Header -->
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#161A24" />
  <rect x="40" y="60" width="720" height="12" fill="#161A24" />
  <line x1="40" y1="72" x2="760" y2="72" stroke="#252B3A" stroke-width="1" />

  <!-- Status indicators -->
  <circle cx="64" cy="51" r="5" fill="#EF4444" />
  <circle cx="82" cy="51" r="5" fill="#F59E0B" />
  <circle cx="100" cy="51" r="5" fill="#10B981" />

  <text x="130" y="56" fill="#F8FAFC" font-family="'Courier New', monospace" font-size="12" font-weight="700">ARDUINO_CORE // SMART_TOUCHLESS_DISPENSER_V2.4</text>

  <rect x="580" y="42" width="160" height="20" rx="10" fill="rgba(212, 175, 55, 0.15)" stroke="url(#ardGold)" stroke-width="0.8" />
  <circle cx="594" cy="52" r="3.5" fill="#38BDF8" />
  <text x="606" y="56" fill="#FFEAA7" font-family="sans-serif" font-size="10" font-weight="700">IoT TELEMETRY ACTIVE</text>

  <!-- Left: Arduino Microcontroller Architecture -->
  <g transform="translate(60, 95)">
    <!-- Circuit Board Base (Teal/Dark Green with Gold Traces) -->
    <rect width="320" height="295" rx="10" fill="#00353A" stroke="url(#ardGold)" stroke-width="1.2" />
    
    <!-- Gold Circuit Traces -->
    <g stroke="url(#ardGold)" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M30 40 L 70 40 L 70 80 L 110 80" />
      <path d="M40 70 L 60 70 L 80 120 L 110 120" />
      <path d="M30 200 L 90 200 L 110 170" />
      <path d="M220 70 L 250 70 L 270 40 L 290 40" />
      <path d="M220 120 L 270 120 L 290 160" />
      <path d="M160 220 L 160 260 L 220 260" />
    </g>

    <!-- Arduino MCU Chip (ATmega328P) -->
    <rect x="110" y="70" width="110" height="110" rx="6" fill="#0C1017" stroke="url(#ardSilver)" stroke-width="1.5" />
    <text x="122" y="115" fill="url(#ardGold)" font-family="'Courier New', monospace" font-size="12" font-weight="800">ATmega328P</text>
    <text x="127" y="132" fill="#94A3B8" font-family="'Courier New', monospace" font-size="10">16MHz • 5V</text>
    
    <!-- IC Pins -->
    <g fill="#D4AF37">
      <circle cx="118" cy="78" r="2" />
      <circle cx="128" cy="78" r="2" />
      <circle cx="138" cy="78" r="2" />
      <circle cx="148" cy="78" r="2" />
      <circle cx="158" cy="78" r="2" />
      <circle cx="168" cy="78" r="2" />
      <circle cx="178" cy="78" r="2" />
      <circle cx="188" cy="78" r="2" />
      <circle cx="198" cy="78" r="2" />
      <circle cx="208" cy="78" r="2" />
    </g>

    <!-- Ultrasonic Sensor Sub-assembly (HC-SR04) -->
    <rect x="30" y="220" width="120" height="60" rx="6" fill="#0D2A35" stroke="url(#ardSilver)" stroke-width="1.2" />
    <!-- Ultrasonic Transducer Eyes (Silver Barrels) -->
    <circle cx="65" cy="250" r="18" fill="url(#ardSilver)" stroke="#0F172A" stroke-width="2" />
    <circle cx="65" cy="250" r="11" fill="#1E293B" />
    <text x="60" y="254" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">T</text>

    <circle cx="115" cy="250" r="18" fill="url(#ardSilver)" stroke="#0F172A" stroke-width="2" />
    <circle cx="115" cy="250" r="11" fill="#1E293B" />
    <text x="110" y="254" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">R</text>
    <text x="50" y="235" fill="url(#ardGold)" font-family="monospace" font-size="9" font-weight="700">HC-SR04 SENSOR</text>

    <!-- Relay Module (5V Single Channel) -->
    <rect x="210" y="220" width="95" height="60" rx="6" fill="#1D4ED8" stroke="url(#ardGold)" stroke-width="1" />
    <rect x="220" y="230" width="75" height="24" rx="3" fill="#1E40AF" />
    <text x="228" y="246" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">5V RELAY</text>
    <circle cx="230" cy="268" r="4" fill="#4ADE80" />
    <text x="240" y="271" fill="#CBD5E1" font-family="monospace" font-size="9">SOLENOID</text>
  </g>

  <!-- Right: Physical Dispenser Chamber & LCD Telemetry -->
  <g transform="translate(415, 95)">
    <!-- Dispenser Housing (Brushed Metallic Platinum / Silver) -->
    <rect width="325" height="295" rx="10" fill="#141822" stroke="url(#ardSilver)" stroke-width="1.2" />

    <!-- LCD 16x2 Telemetry Display (Glowing Green/Blue Matrix) -->
    <rect x="20" y="20" width="285" height="68" rx="6" fill="url(#lcdGlow)" stroke="url(#ardGold)" stroke-width="1.2" />
    <text x="32" y="44" fill="#34D399" font-family="'Courier New', monospace" font-size="13" font-weight="700">&gt; DISPENSING: 250ml</text>
    <text x="32" y="65" fill="#34D399" font-family="'Courier New', monospace" font-size="13" font-weight="700">&gt; PROXIMITY: 4.8cm [OK]</text>
    <circle cx="285" cy="38" r="4" fill="#34D399" />

    <!-- Dispenser Spout Area -->
    <rect x="135" y="105" width="55" height="25" rx="4" fill="url(#ardSilver)" />
    <polygon points="152,130 173,130 166,145 159,145" fill="url(#ardGold)" />

    <!-- Flowing Water Jet -->
    <rect x="160" y="145" width="5" height="60" fill="url(#waterFlow)" rx="2" />
    <ellipse cx="162" cy="180" rx="8" ry="4" fill="#38BDF8" opacity="0.6" />

    <!-- Ultrasonic Sensing Beam Waves (Gold and Blue Arcs) -->
    <path d="M 120 185 A 25 25 0 0 1 120 155" fill="none" stroke="url(#ardGold)" stroke-width="2" stroke-dasharray="3,3" />
    <path d="M 108 195 A 40 40 0 0 1 108 145" fill="none" stroke="url(#ardGold)" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Glass / Cup Being Filled -->
    <path d="M 140 195 L 145 270 Q 162 275 180 270 L 185 195 Z" fill="rgba(255, 255, 255, 0.08)" stroke="url(#ardSilver)" stroke-width="1.8" />
    <!-- Water Inside Cup -->
    <path d="M 143 230 L 145 270 Q 162 275 180 270 L 182 230 Z" fill="#0284C7" opacity="0.75" />
    <ellipse cx="162" cy="230" rx="19" ry="5" fill="#38BDF8" opacity="0.9" />

    <!-- Real-time Stats Cards -->
    <g transform="translate(205, 120)">
      <rect width="105" height="45" rx="6" fill="#1C2230" stroke="#2F384C" stroke-width="1" />
      <text x="10" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9">FLOW RATE</text>
      <text x="10" y="36" fill="url(#ardGold)" font-family="sans-serif" font-size="14" font-weight="800">1.2 L/min</text>
    </g>

    <g transform="translate(205, 175)">
      <rect width="105" height="45" rx="6" fill="#1C2230" stroke="#2F384C" stroke-width="1" />
      <text x="10" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9">HYGIENE STATUS</text>
      <text x="10" y="36" fill="#4ADE80" font-family="sans-serif" font-size="12" font-weight="700">TOUCHLESS</text>
    </g>

    <g transform="translate(205, 230)">
      <rect width="105" height="45" rx="6" fill="#1C2230" stroke="url(#ardGold)" stroke-width="1" />
      <text x="10" y="18" fill="#94A3B8" font-family="sans-serif" font-size="9">DAILY DISPENSED</text>
      <text x="10" y="36" fill="url(#ardSilver)" font-family="sans-serif" font-size="14" font-weight="800">18.4 Liters</text>
    </g>
  </g>
</svg>
