<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="hotelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#996515" />
      <stop offset="100%" stop-color="#593A04" />
    </linearGradient>

    <linearGradient id="hotelSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="hotelCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A22" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <linearGradient id="suiteGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="goldGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="450" fill="#0A0B0E" />

  <!-- Ambient Light Accents -->
  <circle cx="200" cy="100" r="160" fill="#D4AF37" opacity="0.08" filter="url(#goldGlowH)" />
  <circle cx="680" cy="360" r="140" fill="#94A3B8" opacity="0.06" filter="url(#goldGlowH)" />

  <!-- Browser Container -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#111319" stroke="url(#hotelGold)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#171A24" />
  <rect x="40" y="60" width="720" height="12" fill="#171A24" />
  <line x1="40" y1="72" x2="760" y2="72" stroke="#232838" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="64" cy="51" r="5" fill="#EF4444" />
  <circle cx="82" cy="51" r="5" fill="#F59E0B" />
  <circle cx="100" cy="51" r="5" fill="#10B981" />

  <!-- URL Address Pill -->
  <rect x="130" y="42" width="370" height="20" rx="10" fill="#0A0C10" stroke="#2B3242" stroke-width="1" />
  <text x="145" y="56" fill="#D4AF37" font-family="'Segoe UI', Inter, sans-serif" font-size="11">🔒 https://aurum-residences.luxury/suites/booking</text>

  <!-- Hotel Brand Bar -->
  <rect x="55" y="85" width="690" height="46" rx="8" fill="#151821" stroke="#252A38" stroke-width="1" />
  
  <!-- Crown / Crest Icon -->
  <path d="M75 116 L 80 98 L 86 107 L 92 98 L 97 116 Z" fill="url(#hotelGold)" />
  <text x="110" y="114" fill="#F8FAFC" font-family="'Cinzel', 'Times New Roman', serif" font-size="15" font-weight="700" letter-spacing="2">AURUM <tspan fill="url(#hotelGold)">GRAND HOTEL &amp; RESORT</tspan></text>

  <!-- Five Gold Stars -->
  <g fill="#D4AF37" transform="translate(480, 102) scale(0.9)">
    <polygon points="10,1 4,19 19,7 1,7 16,19" />
    <polygon points="32,1 26,19 41,7 23,7 38,19" />
    <polygon points="54,1 48,19 63,7 45,7 60,19" />
    <polygon points="76,1 70,19 85,7 67,7 82,19" />
    <polygon points="98,1 92,19 107,7 89,7 104,19" />
  </g>
  <rect x="610" y="94" width="120" height="28" rx="6" fill="url(#hotelGold)" />
  <text x="625" y="112" fill="#0A0C10" font-family="sans-serif" font-size="11" font-weight="700">MY BOOKINGS</text>

  <!-- Main Left Card: Presidential Suite Preview -->
  <g transform="translate(60, 145)">
    <rect width="400" height="245" rx="10" fill="url(#hotelCardBg)" stroke="#2C3342" stroke-width="1" />
    
    <!-- Suite Image Mockup Area -->
    <rect x="14" y="14" width="372" height="120" rx="8" fill="url(#suiteGlow)" />
    
    <!-- Stylized Modern Suite Graphic -->
    <rect x="25" y="65" width="180" height="55" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <rect x="35" y="45" width="70" height="25" rx="4" fill="#334155" />
    <rect x="115" y="45" width="70" height="25" rx="4" fill="#334155" />
    <!-- Floor lamp with gold light -->
    <line x1="225" y1="40" x2="225" y2="120" stroke="url(#hotelGold)" stroke-width="2" />
    <polygon points="215,50 235,50 240,65 210,65" fill="url(#hotelGold)" />
    <!-- Big French Window with Balcony View -->
    <rect x="260" y="25" width="115" height="95" rx="4" fill="#0F172A" stroke="url(#hotelGold)" stroke-width="1" />
    <circle cx="318" cy="45" r="12" fill="url(#hotelGold)" opacity="0.6" />
    <line x1="260" y1="85" x2="375" y2="85" stroke="#334155" stroke-width="1" />

    <!-- Suite Badge -->
    <rect x="25" y="24" width="125" height="20" rx="4" fill="rgba(10, 12, 16, 0.85)" stroke="url(#hotelGold)" stroke-width="0.9" />
    <text x="32" y="38" fill="#FFE082" font-family="sans-serif" font-size="10" font-weight="700">EXECUTIVE SUITE</text>

    <!-- Suite Information -->
    <text x="18" y="154" fill="#F8FAFC" font-family="'Cinzel', serif" font-size="15" font-weight="700">Royal Oceanfront Penthouse</text>
    <text x="18" y="172" fill="#94A3B8" font-family="sans-serif" font-size="11">King Size Plush Bed • Panoramic Pacific Skyline • Private Infinity Jacuzzi</text>

    <!-- Amenity Pills -->
    <rect x="18" y="185" width="70" height="20" rx="4" fill="#1C212D" stroke="#333D4F" stroke-width="0.8" />
    <text x="27" y="199" fill="#CBD5E1" font-family="sans-serif" font-size="9">Free Wi-Fi</text>

    <rect x="95" y="185" width="80" height="20" rx="4" fill="#1C212D" stroke="#333D4F" stroke-width="0.8" />
    <text x="103" y="199" fill="#CBD5E1" font-family="sans-serif" font-size="9">Infinity Pool</text>

    <rect x="182" y="185" width="85" height="20" rx="4" fill="#1C212D" stroke="#333D4F" stroke-width="0.8" />
    <text x="190" y="199" fill="#CBD5E1" font-family="sans-serif" font-size="9">Free Airport VIP</text>

    <text x="18" y="235" fill="url(#hotelGold)" font-family="sans-serif" font-size="18" font-weight="800">$480</text>
    <text x="75" y="235" fill="#64748B" font-family="sans-serif" font-size="11">/ per night + taxes</text>
    <text x="310" y="235" fill="#4ADE80" font-family="sans-serif" font-size="11" font-weight="600">✓ 2 Rooms Left</text>
  </g>

  <!-- Right Reservation Engine Form -->
  <g transform="translate(480, 145)">
    <rect width="255" height="245" rx="10" fill="url(#hotelCardBg)" stroke="url(#hotelGold)" stroke-width="1.2" />
    
    <text x="20" y="30" fill="url(#hotelGold)" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">INSTANT RESERVATION</text>
    <line x1="20" y1="40" x2="235" y2="40" stroke="#262D3D" stroke-width="1" />

    <!-- Check-in & Check-out Date Pickers -->
    <text x="20" y="60" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">CHECK-IN / OUT DATES</text>
    <rect x="20" y="68" width="215" height="32" rx="6" fill="#10131A" stroke="#333D4F" stroke-width="1" />
    <circle cx="34" cy="84" r="5" fill="#D4AF37" />
    <text x="46" y="88" fill="#F8FAFC" font-family="sans-serif" font-size="11">Oct 24, 2026 ➔ Oct 28, 2026</text>

    <!-- Guests Selection -->
    <text x="20" y="118" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">GUESTS &amp; ROOMS</text>
    <rect x="20" y="126" width="215" height="32" rx="6" fill="#10131A" stroke="#333D4F" stroke-width="1" />
    <text x="34" y="146" fill="#F8FAFC" font-family="sans-serif" font-size="11">2 Adults, 1 Child • 1 Suite</text>

    <!-- Pricing Summary -->
    <rect x="20" y="168" width="215" height="26" rx="4" fill="#181D27" />
    <text x="28" y="185" fill="#94A3B8" font-family="sans-serif" font-size="10">4 Nights Total (Tax Incl.):</text>
    <text x="175" y="185" fill="url(#hotelGold)" font-family="sans-serif" font-size="11" font-weight="800">$1,920</text>

    <!-- Book Now Button -->
    <rect x="20" y="202" width="215" height="32" rx="6" fill="url(#hotelGold)" />
    <text x="78" y="222" fill="#0A0B0E" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">CONFIRM BOOKING</text>
  </g>
</svg>
