<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="50%" stop-color="#F2C542" />
      <stop offset="100%" stop-color="#BF8C1E" />
    </linearGradient>

    <!-- Silver Metallic Gradients -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C24" />
      <stop offset="100%" stop-color="#0F1116" />
    </linearGradient>

    <linearGradient id="dishGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="50%" stop-color="#E64A19" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="dishGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="60%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Luxury Canvas -->
  <rect width="800" height="450" fill="#0A0C10" />

  <!-- Background Ambient Glow & Grid -->
  <circle cx="680" cy="80" r="180" fill="#D4AF37" opacity="0.07" filter="url(#goldGlow)" />
  <circle cx="120" cy="380" r="150" fill="#CBD5E1" opacity="0.05" filter="url(#goldGlow)" />

  <g opacity="0.04" stroke="#D4AF37" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Browser Window Wrapper -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#12151D" stroke="url(#goldGrad)" stroke-width="1.5" filter="url(#subtleShadow)" />

  <!-- Browser Header Bar -->
  <rect x="40" y="30" width="720" height="42" rx="14" fill="#181C26" />
  <rect x="40" y="60" width="720" height="12" fill="#181C26" />
  <line x1="40" y1="72" x2="760" y2="72" stroke="#252A36" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="64" cy="51" r="5" fill="#EF4444" />
  <circle cx="82" cy="51" r="5" fill="#F59E0B" />
  <circle cx="100" cy="51" r="5" fill="#10B981" />

  <!-- URL Address Pill -->
  <rect x="130" y="42" width="360" height="20" rx="10" fill="#0D0F14" stroke="#2E3444" stroke-width="1" />
  <circle cx="145" cy="52" r="3" fill="#D4AF37" />
  <text x="156" y="56" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="11">https://tapseafood.order/menu?tier=fresh-catch</text>

  <!-- Live Status Badge in Header -->
  <rect x="620" y="42" width="120" height="20" rx="10" fill="rgba(212, 175, 55, 0.15)" stroke="url(#goldGrad)" stroke-width="0.8" />
  <circle cx="634" cy="52" r="3.5" fill="#4ADE80" />
  <text x="644" y="56" fill="#FFE082" font-family="'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600">LIVE KITCHEN</text>

  <!-- Web App Navigation Bar -->
  <rect x="55" y="85" width="690" height="45" rx="8" fill="#161A23" stroke="#252A36" stroke-width="1" />
  
  <!-- Logo -->
  <circle cx="80" cy="107" r="14" fill="url(#goldGrad)" />
  <!-- Seafood Fish/Lobster Icon in Logo -->
  <path d="M72 108 C 76 101, 84 101, 88 107 C 84 113, 76 113, 72 108 Z" fill="#12151D" />
  <text x="104" y="112" fill="#FFFFFF" font-family="'Segoe UI', Inter, sans-serif" font-size="15" font-weight="700" letter-spacing="1">TAP<tspan fill="url(#goldGrad)">SEAFOOD</tspan></text>

  <!-- Nav links -->
  <text x="250" y="112" fill="#FFE082" font-family="'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600">Catch of the Day</text>
  <line x1="250" y1="117" x2="340" y2="117" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="365" y="112" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="12">Shellfish &amp; Crab</text>
  <text x="475" y="112" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="12">Gourmet Platters</text>

  <!-- Cart Button -->
  <rect x="625" y="94" width="105" height="28" rx="6" fill="url(#goldGrad)" />
  <text x="642" y="112" fill="#0D0F14" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700">CART (3) • $94</text>

  <!-- Dish Card 1: Lobster Thermidor -->
  <g transform="translate(65, 145)">
    <rect width="205" height="245" rx="10" fill="url(#cardBg)" stroke="url(#goldGrad)" stroke-width="1" />
    
    <!-- Dish Image Area -->
    <rect x="12" y="12" width="181" height="105" rx="8" fill="#1F2430" />
    <!-- Lobster Illustration -->
    <circle cx="102" cy="62" r="38" fill="url(#dishGrad1)" opacity="0.85" />
    <path d="M85 62 Q 102 45 119 62 Q 102 80 85 62 Z" fill="#FFE082" opacity="0.9" />
    <circle cx="102" cy="62" r="18" fill="#FF8A65" />
    <circle cx="96" cy="58" r="4" fill="#FFE082" />
    <circle cx="108" cy="58" r="4" fill="#FFE082" />
    <!-- Freshness badge -->
    <rect x="20" y="20" width="60" height="18" rx="4" fill="rgba(10, 12, 16, 0.75)" stroke="#D4AF37" stroke-width="0.8" />
    <text x="27" y="32" fill="#FFE082" font-family="sans-serif" font-size="9" font-weight="700">PREMIUM</text>

    <!-- Dish Info -->
    <text x="14" y="137" fill="#F8FAFC" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700">Lobster Thermidor</text>
    <text x="14" y="153" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10">Butter poached, white wine &amp; herb gruyère</text>
    <text x="14" y="174" fill="url(#goldGrad)" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800">$48.50</text>
    <text x="75" y="174" fill="#64748B" font-family="'Segoe UI', Inter, sans-serif" font-size="10">/ 500g</text>

    <!-- Order Button -->
    <rect x="14" y="192" width="177" height="30" rx="6" fill="url(#goldGrad)" />
    <text x="72" y="211" fill="#0F1116" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700">+ Add to Cart</text>
  </g>

  <!-- Dish Card 2: Jumbo King Prawns -->
  <g transform="translate(290, 145)">
    <rect width="205" height="245" rx="10" fill="url(#cardBg)" stroke="#333A4A" stroke-width="1" />
    
    <!-- Dish Image Area -->
    <rect x="12" y="12" width="181" height="105" rx="8" fill="#1F2430" />
    <!-- Prawn Illustration -->
    <circle cx="102" cy="62" r="38" fill="url(#dishGrad1)" opacity="0.65" />
    <path d="M80 65 Q 102 38 124 62 Q 102 75 80 65 Z" fill="#FFAB91" />
    <circle cx="102" cy="62" r="14" fill="#D4AF37" />
    <!-- Freshness badge -->
    <rect x="20" y="20" width="55" height="18" rx="4" fill="rgba(10, 12, 16, 0.75)" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="27" y="32" fill="#E2E8F0" font-family="sans-serif" font-size="9" font-weight="700">CHEF PICK</text>

    <!-- Dish Info -->
    <text x="14" y="137" fill="#F8FAFC" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700">Jumbo King Prawns</text>
    <text x="14" y="153" fill="#94A3B8" font-family="'Segoe UI', Inter, sans-serif" font-size="10">Charcoal grilled with garlic infused butter</text>
    <text x="14" y="174" fill="url(#silverGrad)" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="800">$32.00</text>
    <text x="75" y="174" fill="#64748B" font-family="'Segoe UI', Inter, sans-serif" font-size="10">/ 6 pcs</text>

    <!-- Order Button -->
    <rect x="14" y="192" width="177" height="30" rx="6" fill="#1E232E" stroke="#3E4758" stroke-width="1" />
    <text x="72" y="211" fill="#E2E8F0" font-family="'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600">+ Add to Cart</text>
  </g>

  <!-- Live Order Tracking Drawer (Right Side) -->
  <g transform="translate(515, 145)">
    <rect width="220" height="245" rx="10" fill="#141720" stroke="url(#goldGrad)" stroke-width="1" />
    
    <!-- Header -->
    <text x="18" y="30" fill="url(#goldGrad)" font-family="'Segoe UI', Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">ORDER TRACKING #8492</text>
    <line x1="18" y1="42" x2="202" y2="42" stroke="#252A36" stroke-width="1" />

    <!-- Status Step 1: Confirmed -->
    <circle cx="28" cy="65" r="7" fill="#D4AF37" />
    <circle cx="28" cy="65" r="3" fill="#0F1116" />
    <text x="44" y="69" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">Order Confirmed</text>
    <text x="160" y="69" fill="#64748B" font-family="sans-serif" font-size="10">18:24</text>
    <line x1="28" y1="74" x2="28" y2="98" stroke="#D4AF37" stroke-width="1.5" />

    <!-- Status Step 2: Preparing in Kitchen -->
    <circle cx="28" cy="107" r="7" fill="#D4AF37" />
    <circle cx="28" cy="107" r="3" fill="#FFFFFF" />
    <text x="44" y="108" fill="#FFE082" font-family="sans-serif" font-size="11" font-weight="700">Seafood Sautéing</text>
    <text x="44" y="120" fill="#94A3B8" font-family="sans-serif" font-size="9">Chef Mario - Station 4</text>
    <line x1="28" y1="116" x2="28" y2="140" stroke="#333A4A" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Status Step 3: Out for Delivery -->
    <circle cx="28" cy="149" r="6" fill="#252A36" stroke="#64748B" stroke-width="1" />
    <text x="44" y="153" fill="#64748B" font-family="sans-serif" font-size="11">Courier Dispatch</text>

    <!-- Total Pill -->
    <rect x="18" y="178" width="184" height="48" rx="8" fill="#1A1F2B" stroke="#2D3342" stroke-width="1" />
    <text x="30" y="196" fill="#94A3B8" font-family="sans-serif" font-size="10">Estimated Arrival</text>
    <text x="30" y="214" fill="#4ADE80" font-family="sans-serif" font-size="13" font-weight="700">18 - 25 Mins</text>
    <text x="140" y="206" fill="url(#goldGrad)" font-family="sans-serif" font-size="15" font-weight="800">$94.50</text>
  </g>
</svg>
